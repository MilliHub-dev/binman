services:
  postgres:
    image: postgres:16-alpine
    container_name: binman-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: binman
      POSTGRES_PASSWORD: binman
      POSTGRES_DB: binman
    ports:
      - '5432:5432'
    volumes:
      - binman-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U binman -d binman']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: binman-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - binman-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  binman-pgdata:
  binman-redisdata:
